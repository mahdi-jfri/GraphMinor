      module: "Solution.lean"
      status: "proved"
    - source: "Graph Minors XIII, the main result, page 65 (not numbered in the paper)"
      lean: "GraphMinor.disjoint_paths_algorithm"
      module: "Solution.lean"
      status: "proved"
    - source: "Graph Minors XIII, (5.5), page 83, a result of Thomason (1984), for every p >= 1"
      lean: "GraphMinor.thomason_bound"
      module: "SolutionThomason.lean"
      status: "proved"
