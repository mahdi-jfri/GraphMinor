version: "v0.4"

project:
  name: "Graph Minors I to XXII"
  description: >-
    A Lean 4 formalization of the Graph Minors series of N. Robertson and P. D. Seymour. It proves
    every numbered result of the twenty-two papers, and the three main results of the series: the
    graph minor theorem (Wagner's conjecture), the structure theorem for graphs that exclude a
    non-planar graph (Graph Minors XVI, (1.3)), and an algorithm that decides the k disjoint paths
    problem in time O(n^3) for each fixed k (the main result of Graph Minors XIII, page 65).
    The results that the papers cite from outside the series are proved as well, among them
    Kruskal's tree theorem, Wagner's theorem on graphs with no K_5 minor, the classification of
    surfaces, and Thomason's bound 2.68 p sqrt(log_2 p) for complete minors, for every p. Where a
    paper is wrong as printed, the library proves a corrected form, and corrections/ describes each
    correction.
  authors: ["MohammadTaghi Hajiaghayi", "Mahdi JafariRaviz"]
  responsible_maintainers: ["Mahdi JafariRaviz"]
  license: "Apache-2.0"

