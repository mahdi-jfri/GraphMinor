fidelity:
  divergences: >-
    Where a paper is wrong as printed, the Lean theorem proves a corrected form: a misprint
    corrected (119), a statement mistake replaced by the form that its later uses need (30), a
    hypothesis added for a degenerate case (14), or a proof gap filled (60). Where a paper omits a
    proof, leaves it to the reader or only sketches it, the Lean proof gives the argument (106
    places). Each of these is described in corrections/, with the page of the paper. Graphs are Mathlib's Graph type and may have loops
    and parallel edges, as in the papers. The algorithm of Graph Minors XIII (page 65) is stated for a
    word RAM whose words have c log n bits, with time measured in steps of this machine. Graph
    Minors XIII uses Shiloach's algorithm for two disjoint paths, which its source gives only in
    outline. The library replaces it with a crossing extractor and a linear-time planarity test,
    each with a written proof in docs/. The results cited from outside the series are proved,
    some by other proofs than the original ones. The README lists them.

review:
